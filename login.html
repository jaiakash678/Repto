<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repto – Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <a href="index.html" class="logo auth-logo">Rep<span>to</span></a>

    <div class="auth-card">

      <!-- Tabs to switch between the two forms -->
      <div class="auth-tabs">
        <button id="tabSignin" class="auth-tab active" type="button">Sign in</button>
        <button id="tabSignup" class="auth-tab" type="button">Sign up</button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="signinForm" class="auth-form">
        <label for="signinEmail">Email</label>
        <input type="email" id="signinEmail" placeholder="you@example.com" required>

        <label for="signinPassword">Password</label>
        <input type="password" id="signinPassword" placeholder="Your password" required>

        <button type="submit" class="auth-submit">Sign in</button>
      </form>

      <!-- SIGN UP FORM (hidden at first) -->
      <form id="signupForm" class="auth-form hidden">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" placeholder="Your name" required>

        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>

        <label for="signupConfirm">Confirm password</label>
        <input type="password" id="signupConfirm" placeholder="Type the password again" required>

        <button type="submit" class="auth-submit">Create account</button>
      </form>

      <!-- Error or success messages appear here -->
      <p id="authMessage" class="auth-message"></p>
    </div>

    <p class="auth-note">Demo login: accounts are saved only in this browser.</p>
    <a href="index.html" class="back-link">← Back to Repto</a>
  </div>

  <script src="auth.js"></script>
</body>
</html>
